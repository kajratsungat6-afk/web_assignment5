<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">

        <form class="card ticket-card" action="#" method="get">
          <h1 class="card-header">Book a train ticket</h1>

          <div class="card-body">
            <div class="row g-3">

              <!-- Trip type: two radio inputs shown as a Bootstrap button group -->
              <fieldset class="col-12 mb-2">
                <legend class="visually-hidden">Trip type</legend>
                <div class="btn-group trip-switch">
                  <input type="radio" class="btn-check" name="trip" id="oneway" value="oneway" checked>
                  <label class="btn btn-seg" for="oneway">One way</label>
                  <input type="radio" class="btn-check" name="trip" id="round" value="round">
                  <label class="btn btn-seg" for="round">Round trip</label>
                </div>
              </fieldset>

              <!-- Floating labels -->
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="from" name="from" placeholder="From" autocomplete="off" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="to" name="to" placeholder="To" autocomplete="off" required>
                  <label for="to">To</label>
                </div>
              </div>

              <!-- Dates and select -->
              <div class="col-md-4">
                <label for="departure" class="form-label">Departure</label>
                <input type="date" class="form-control" id="departure" name="departure" required>
              </div>
              <div class="col-md-4">
                <label for="return" class="form-label">Return</label>
                <input type="date" class="form-control" id="return" name="return">
              </div>
              <div class="col-md-4">
                <label for="passengers" class="form-label">Passengers</label>
                <select class="form-select" id="passengers" name="passengers" required>
                  <option value="1" selected>1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>

              <!-- Inline radios -->
              <fieldset class="col-12">
                <legend class="form-label">Carriage class</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                  <label class="form-check-label" for="seat">Seat</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked required>
                  <label class="form-check-label" for="coupe">Coupé</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper" required>
                  <label class="form-check-label" for="sleeper">Sleeper</label>
                </div>
              </fieldset>

              <!-- Input group + email -->
              <div class="col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <div class="input-group">
                  <span class="input-group-text" id="phone-code">+7</span>
                  <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78"
                         autocomplete="tel-national" aria-describedby="phone-code"
                         pattern="\d{3} ?\d{3} ?\d{2} ?\d{2}" title="10 digits, for example 701 234 56 78" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
              </div>

              <!-- Switch + checkbox -->
              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                  <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rules" name="rules" required>
                  <label class="form-check-label" for="rules">I agree with the carriage rules</label>
                </div>
              </div>

              <!-- HTML order: Clear, Find trains. On phones flex-column-reverse puts Find trains on top -->
              <div class="col-12 d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 pt-2">
                <button type="reset" class="btn btn-clear">Clear</button>
                <button type="submit" class="btn btn-find">Find trains</button>
              </div>

            </div>
          </div>
        </form>

      </div>
    </div>
  </main>
</body>
</html>
